# Configuración de Supervisor para DAMI Centro Inteligente

[program:dami-backend]
command=python3 server.py
directory=/app/backend
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/dami-backend.log
environment=PATH="/root/.venv/bin:/usr/local/bin:/usr/bin:/bin"

[program:dami-frontend]
command=yarn start
directory=/app/frontend
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/dami-frontend.log
environment=PATH="/usr/local/bin:/usr/bin:/bin",NODE_ENV="development"

[program:dami-mongodb]
command=mongod --dbpath=/var/lib/mongodb --logpath=/var/log/mongodb/mongod.log --fork
user=mongodb
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/dami-mongodb.log

[group:dami-services]
programs=dami-backend,dami-frontend,dami-mongodb
priority=999